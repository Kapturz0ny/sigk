[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "2-low-light-img"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "imageio>=2.38.1",
    "jupyterlab>=4.6.6",
    "lightning>=2.6.6",
    "lpips>=0.1.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "rawpy>=0.28.0",
    "requests>=2.34.2",
    "ruff>=0.17.4",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
