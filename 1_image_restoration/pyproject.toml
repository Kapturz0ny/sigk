[project]
name = "1-image-restoration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyterlab>=4.6.4",
    "lightning>=2.6.6",
    "lpips>=0.1.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "torch>=2.14.1",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.1",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

